name: Update market data

on:
  schedule:
    # 16:45 IST (11:15 UTC), Monday through Friday, after the NSE session.
    - cron: '15 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-deployment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate market data
        run: npm run screen

      - name: Persist Top 10 outcome history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/top-10-performance.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Top 10 outcome history"
            git push
          fi

      - name: Build site
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: stock-identifier
          channelId: live
