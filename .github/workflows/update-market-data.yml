name: Update market data

on:
  # Started by cron-job.org through the GitHub API, not by `schedule:`. GitHub ran our
  # scheduled jobs 7-10 hours late, and runs after midnight IST got day-old bars from Yahoo.
  #   16:35 and 16:50 IST, Monday-Friday: daily update, done by 17:00 (the second is a retry).
  #   08:45 IST Saturday: weekly Top 10 review on Friday's completed candle.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-deployment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate market data
        run: npm run screen

      - name: Refuse to publish stale data
        run: npx tsx scripts/check-freshness.ts

      - name: Persist market data and Top 10 portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market data and Top 10 portfolio"
            git push
          fi

      - name: Build site
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: stock-identifier
          channelId: live
